name: Secret Scan

# Sprint 17.5 closeout, Workstream O. Independently-visible security gate,
# separate from warehouse-validation.yml so a leaked secret or a failed
# dependency audit is never buried inside ordinary build/lint/test output.
#
# `npm audit --omit=dev --audit-level=high` here enforces
# warehouse/reports/dependency_release_exception.md, which covers dev/
# warehouse-only tooling advisories only (expires 2026-08-24 — this gate
# will start failing on schedule once that exception lapses unless the
# underlying advisories are resolved first; that is intentional).
#
# Runs once with continue-on-error on the secret-scan step for this PR
# cycle to rule out false positives before flipping it to a hard blocker.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan + dependency audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (produces .next/ output for artifact + source-map scan)
        run: npm run build

      - name: Secret scan (tracked files, build output, source maps)
        # continue-on-error for this PR cycle only, to confirm no false
        # positives before treating this as a hard release gate.
        continue-on-error: true
        run: npm run security:secrets:check

      - name: Production dependency audit (npm audit --omit=dev --audit-level=high)
        run: npm audit --omit=dev --audit-level=high

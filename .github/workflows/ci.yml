# V7C — Pull-request CI gate for Deal Hunter (and the whole app).
#
# SAFETY (deliberate, least-privilege):
#   * permissions: contents:read ONLY — no write, no deploy, no PR/issue write.
#   * No secrets are referenced. No database access. No Production env.
#   * Actions are PINNED to full commit SHAs (supply-chain hardening); the human-
#     readable version tag is in the trailing comment.
#   * Runs on pull_request only (never auto-runs privileged jobs on forks with secrets,
#     because there are no secrets to leak).
#
# Scope note: the TypeScript gate uses tsconfig.ci.json, which typechecks all SHIPPING
# source (0 errors today) and excludes *.test.ts(x) — the 39 remaining `error TS`
# diagnostics are pre-existing TEST-harness typing debt, tracked separately (see
# docs/decisions/V7C_ci_workflow.md). This gate does not hide those; it scopes them out
# truthfully and they get their own fix issue.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (shipping source; test-file debt excluded, see V7C_ci_workflow.md)
        run: npm run typecheck:ci

      - name: Unit + migration tests (Vitest, incl. PGlite migration/static validation)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Non-secret build placeholders so `next build` never needs real Production
          # credentials in CI. These are throwaway values, not secrets.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: RLS policy coverage check
        run: npm run warehouse:rls:check

      - name: Secret scan (source + built artifacts + source maps)
        run: npm run security:secrets:check

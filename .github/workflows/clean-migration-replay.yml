name: Clean Migration Replay

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replay:
    name: Replay migrations 001-044 from blank database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clean_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clean_replay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Replay committed migrations from blank local PostGIS database
        env:
          CLEAN_REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clean_replay
        run: node scripts/clean-migration-replay.mjs

      - name: Static RLS corpus check
        run: npm run warehouse:rls:check

      - name: Upload redacted replay report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-migration-chain-001-044-report
          path: clean-replay-artifacts/
          if-no-files-found: error

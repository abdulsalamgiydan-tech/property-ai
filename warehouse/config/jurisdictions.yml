# Jurisdiction registry (Sprint 10, Phase 2)
#
# One entry per Australian state/territory this warehouse supports or plans
# to support. Referenced by the state-adapter architecture
# (warehouse/docs/STATE_ADAPTER_ARCHITECTURE.md) and the refresh
# orchestrator (warehouse/config/refresh_policies.yml).

jurisdictions:

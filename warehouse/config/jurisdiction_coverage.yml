# National jurisdiction coverage contract (Sprint 11, Workstream 3)
#
# Source of truth for what data actually exists per jurisdiction x metric
# family. Prevents the product from implying uniform national coverage.
# Feeds a safe read-only public view (Workstream 20) so every research
# page can show an honest availability badge per metric.
#
# Status vocabulary (used consistently across every jurisdiction/metric):
#   available          — direct official data loaded (or a confirmed free
#                         source not yet loaded but ready to build)
#   partially_available — available at a coarser geography or narrower
#                         dwelling-type/date coverage than the ideal
#   derived             — computed from other available inputs (e.g. yield
#                         from separately-sourced sales+rent)
#   stale                — was available, source has not refreshed within
#                         its expected cadence
#   unavailable           — no official source identified
#   official_source_restricted — a source exists but its licence/access
#                         terms are unclear or restrictive (e.g. WA sales
#                         evidence's Personal Use License)
#   official_source_paid  — a source exists but requires payment; not
#                         purchased without explicit human approval

jurisdictions:
  NSW:
    asgs_state_code: "1"
    onboard_status: fully_onboarded
    since_sprint: 5
    metric_families:
      sales: { status: available, earliest_period: "2001", latest_period: current, geography_levels: [SAL, POA], dwelling_type_detail: "detached_house, apartment_unit, townhouse_villa_semidetached, residential_land, other_residential", direct_or_derived: direct, refresh_frequency: weekly_plus_annual, confidence_ceiling: high, notes: "transaction-level, VG PSI" }
      rents: { status: available, earliest_period: "2011", latest_period: current, geography_levels: [SAL, POA], direct_or_derived: "direct (POA), derived (SAL, via correspondence)", refresh_frequency: quarterly, confidence_ceiling: high }
      yields: { status: derived, direct_or_derived: derived, confidence_ceiling: medium, notes: "combines separately-sourced sales+rent, periods not forced to align" }
      dwelling_stock: { status: available, geography_levels: [SAL, POA], direct_or_derived: direct, refresh_frequency: five_yearly_census }
      building_approvals: { status: available, geography_levels: [SAL, POA], direct_or_derived: direct, refresh_frequency: monthly }
      demographics: { status: available, geography_levels: [SAL, POA], direct_or_derived: direct, refresh_frequency: five_yearly_census }
      income: { status: available, geography_levels: [SAL, POA], direct_or_derived: direct, refresh_frequency: five_yearly_census }
      tenure: { status: available, geography_levels: [SAL, POA], direct_or_derived: direct, refresh_frequency: five_yearly_census }
      population_growth: { status: partially_available, notes: "2016-2021 comparison NULL pending Workstream 4 harmonisation; single-Census population is available" }
      affordability: { status: derived, direct_or_derived: derived, confidence_ceiling: medium, notes: "shared national assumption scenario, not state-specific" }
      land_values: { status: unavailable, notes: "no official bulk land-value source loaded" }
      vacancy: { status: unavailable, notes: "no official vacancy-rate source identified" }
      planning_pipeline: { status: unavailable }


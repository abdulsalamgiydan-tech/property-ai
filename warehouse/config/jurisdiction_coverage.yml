shared_notes:
  - "dwelling_stock, building_approvals, demographics, income, tenure are 'available' for EVERY jurisdiction because ASGS geography and Census/Building-Approvals data were loaded nationally in Sprints 2-4 — this is not jurisdiction-specific work, confirmed by direct query for each state, not assumed."
  - "population_growth is 'partially_available' everywhere pending Workstream 4's 2016-2021 Census harmonisation — a single-Census population figure is available now, but the growth RATE is not until harmonisation completes."
  - "land_values, vacancy, and planning_pipeline are unavailable for every jurisdiction — no official free bulk source for any of these three metric families was identified in this sprint for any state, including NSW/VIC. This is a genuine, honestly-documented national gap, not a jurisdiction-specific one."
  - "affordability is 'unavailable' for QLD/SA/WA/TAS/ACT/NT because it requires a sales price input, which none of those jurisdictions have loaded yet — it will become 'derived' automatically once/if a sales source is onboarded for a state, using the exact same shared assumption scenario as NSW/VIC (no per-state redefinition)."
